# Draws the contribution calendar as a 3D graph and publishes the images to the "output-3d" branch,
# which README.md loads (a light and a dark version). Kept on its own branch so that the snake
# workflow, which replaces the "output" branch on every run, cannot remove these files.

name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 3 * * *" # every day
  workflow_dispatch: # allows running it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the 3D graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Publish to the output-3d branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-3d
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
